name: Audit & deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    # Setiap 6 jam (UTC). 00:00, 06:00, 12:00, 18:00.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  audit:
    name: Audit website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout website PERKIM
        uses: actions/checkout@v4
        with:
          repository: perkimkualalangat/Website-PERKIM
          path: perkim-web
          token: ${{ secrets.WEBSITE_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run audit + Lighthouse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON: python
        run: node tools/audit.mjs --site perkim-web --lighthouse

      - name: Commit snapshot data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/history.json data/uptime.json data/db
          if git diff --cached --quiet; then
            echo "Tiada perubahan data untuk di-commit."
          else
            git commit -m "audit: kemas kini data pemantauan [skip ci]"
            git push
          fi

      - name: Sediakan artifact Pages
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r css js assets data _site/
          find _site -name '.static.json' -delete
          du -sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: audit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
