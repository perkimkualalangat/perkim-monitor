<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PERKIM Monitor | Kuala Langat</title>
  <meta name="description" content="Sistem pemantauan laman web PERKIM Cawangan Kuala Langat: halaman, program, PDF, pautan, SEO, kebolehcapaian, prestasi dan deploy.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14532d">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/monitor.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Langkau ke kandungan</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="15" fill="rgba(255,255,255,.08)"/>
          <path d="M32 11c8.4 7.6 12.6 14 12.6 22.2A12.6 12.6 0 0 1 19.4 33.2C19.4 25 23.6 18.6 32 11Z" fill="#d4af37"/>
          <path d="M32 21v20M23 31h18" stroke="#14532d" stroke-width="3.2" stroke-linecap="round"/>
          <circle cx="32" cy="48" r="2.4" fill="#d4af37"/>
        </svg>
        <div>
          <strong>PERKIM</strong>
          <span>Monitor</span>
        </div>
      </div>
      <div class="sidebar__meta">Cawangan Kuala Langat</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar__footer">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Sistem pemantauan dalaman</span>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar__title">
          <span class="eyebrow">Pemantauan laman</span>
          <h1 id="page-title">Ringkasan</h1>
        </div>
        <div class="topbar__actions">
          <span class="last-updated" id="last-updated">Memuatkan…</span>
          <button class="icon-btn" id="theme-btn" type="button" aria-label="Tukar tema" title="Tukar tema">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
          </button>
          <button class="btn btn--ghost" id="refresh-btn" type="button" title="Muat semula data JSON">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
            Muat semula
          </button>
          <a class="btn btn--primary" id="site-link" href="https://perkimkualalangat.github.io/Website-PERKIM/" target="_blank" rel="noopener">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
            <span>Buka laman</span>
          </a>
        </div>
      </header>

      <main id="main" class="content" tabindex="-1">
        <div class="loading">
          <div class="spinner" aria-hidden="true"></div>
          <p>Memuatkan data pemantauan…</p>
        </div>
      </main>

      <footer class="footer">
        <span>PERKIM Monitor · Data dijana automatik oleh GitHub Actions</span>
        <span id="footer-meta">—</span>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>
    <div class="noscript">Dashboard ini memerlukan JavaScript. Sila aktifkan JavaScript untuk melihat data pemantauan.</div>
  </noscript>
</body>
</html>
